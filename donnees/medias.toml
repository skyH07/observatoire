# ---------------------------------------------------------------------
# SECTION 3 — CORSE (territoire pilote)
# ---------------------------------------------------------------------
 
# Corse-Matin ne publie pas de flux RSS d'articles à ma connaissance ;
# son relais Bluesky officiel, actif, en tient lieu pour la détection.
# ATTENTION : les liens de ce flux pointent vers Bluesky, pas vers
# corsematin.com — au rattachement d'un article, remplace l'URL par
# celle de l'article sur corsematin.com et archive celle-ci.
[[media]]
id = "corse-matin"
nom = "Corse-Matin"
famille = "presse_regionale"
groupe = "Groupe Nice-Matin"
departements = ["2A", "2B"]
suivi_depuis = "2026-07-31"
flux = "https://bsky.app/profile/did:plc:3uv44ned22nr4fu3fmdvrezu/rss"
 
