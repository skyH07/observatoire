# Le périmètre de suivi. Un média absent de ce fichier ne peut pas être
# comptabilisé comme « n'ayant pas couvert » : on ne mesure une omission
# que sur un périmètre déclaré à l'avance.
#
# Champs :
#   departements          absent = média national (couvre tout) ;
#                         présent = média territorial, éligible seulement
#                         pour les faits de ces départements.
#   flux_complementaires  flux additionnels de DÉTECTION (éditions locales).
#                         L'unité de mesure reste le média, jamais le flux.
#   groupe                propriétaire, informatif, à vérifier à chaque ajout.
#
# Toute modification passe par proposition et ne vaut que pour l'avenir.
 
# ---------------------------------------------------------------------
# SECTION 1 — MÉDIAS D'EXEMPLE (fictifs)
# À supprimer dans la même proposition que le premier événement réel,
# avec les fichiers EVT-2026-0001 et EVT-2026-0002 qui les référencent.
# ---------------------------------------------------------------------
 
